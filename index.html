<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的中文网站 - Cloudflare Pages 演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 700px;
        }
        h1 { font-size: 2.8em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .subtitle { font-size: 1.2em; opacity: 0.9; margin-bottom: 40px; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .card {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px 15px;
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card .icon { font-size: 2em; margin-bottom: 10px; }
        .card h3 { font-size: 1em; margin-bottom: 8px; }
        .card p { font-size: 0.85em; opacity: 0.85; }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            border-radius: 20px;
            padding: 8px 20px;
            margin-top: 30px;
            font-size: 0.9em;
        }
        .version { margin-top: 15px; opacity: 0.7; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 欢迎来到我的网站</h1>
        <p class="subtitle">基于 GitHub + Cloudflare Pages 自动部署</p>

        <div class="cards">
            <div class="card">
                <div class="icon">🚀</div>
                <h3>自动部署</h3>
                <p>推送代码即自动上线</p>
            </div>
            <div class="card">
                <div class="icon">⚡</div>
                <h3>全球加速</h3>
                <p>Cloudflare CDN 极速访问</p>
            </div>
            <div class="card">
                <div class="icon">🔒</div>
                <h3>免费 HTTPS</h3>
                <p>自动配置 SSL 证书</p>
            </div>
        </div>

        <div class="badge">✅ 部署状态：正常运行中</div>
        <p class="version">版本 v1.0.0 | 构建时间：2026-04-05</p>
    </div>
</body>
</html>
